name: GCP CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: playground-s-11-e49aa9b2
  REGION: europe-west1
  GAR_REPOSITORY: ahop

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      backend_digest: ${{ steps.backend-digest.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/857898679571/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@playground-s-11-e49aa9b2.iam.gserviceaccount.com'
          project_id: 'playground-s-11-e49aa9b2'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build frontend
        run: |
          docker build \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/frontend:${GITHUB_SHA}" \
            ./frontend

      - name: Build backend
        run: |
          docker build \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend:${GITHUB_SHA}" \
            ./backend

      - name: Push frontend
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/frontend:${GITHUB_SHA}"

      - name: Push backend
        run: |
          docker push \
            "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend:${GITHUB_SHA}"

      - name: Resolve backend digest
        id: backend-digest
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend:${GITHUB_SHA}"

          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" \
            --format='value(image_summary.digest)')"

          echo "Backend digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/857898679571/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@playground-s-11-e49aa9b2.iam.gserviceaccount.com'
          project_id: 'playground-s-11-e49aa9b2'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Show backend digest
        run: |
          echo "Deploying digest: ${{ needs.build.outputs.backend_digest }}"

      - name: Deploy backend to DEV
        run: |
          gcloud run deploy ahop-backend-dev \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend@${{ needs.build.outputs.backend_digest }}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated

      - name: Get backend URL
        run: |
          BACKEND_URL="$(gcloud run services describe ahop-backend-dev \
            --region="${REGION}" \
            --format='value(status.url)')"

          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          echo "Backend URL: $BACKEND_URL"

      - name: Smoke test health
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            "$BACKEND_URL/api/health"

      - name: Smoke test version
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            "$BACKEND_URL/api/version"



  deploy-test:
    needs:
      - build
      - deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/857898679571/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deployer@playground-s-11-e49aa9b2.iam.gserviceaccount.com'
          project_id: 'playground-s-11-e49aa9b2'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Show promoted digest
        run: |
          echo "Promoting digest to TEST:"
          echo "${{ needs.build.outputs.backend_digest }}"

      - name: Deploy backend to TEST
        run: |
          gcloud run deploy ahop-backend-test \
            --image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/backend@${{ needs.build.outputs.backend_digest }}" \
            --region="${REGION}" \
            --platform=managed \
            --allow-unauthenticated

      - name: Get TEST backend URL
        run: |
          TEST_BACKEND_URL="$(gcloud run services describe ahop-backend-test \
            --region="${REGION}" \
            --format='value(status.url)')"

          echo "TEST_BACKEND_URL=$TEST_BACKEND_URL" >> "$GITHUB_ENV"
          echo "TEST backend URL: $TEST_BACKEND_URL"

      - name: Smoke test TEST health
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            "$TEST_BACKEND_URL/api/health"

      - name: Smoke test TEST version
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            "$TEST_BACKEND_URL/api/version"
